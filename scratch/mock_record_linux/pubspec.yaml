name: record_linux
description: Stub record linux package — satisfies record_platform_interface 1.6.0 for Android/iOS builds.
version: 0.7.3
environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.16.0"
dependencies:
  flutter:
    sdk: flutter
  record_platform_interface: ^1.0.2

flutter:
  plugin:
    implements: record
    platforms:
      linux:
        pluginClass: RecordLinuxPlugin
        dartPluginClass: RecordLinux
