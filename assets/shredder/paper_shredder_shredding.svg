<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="headBodyGradShred" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="50%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="silverPlateGradShred" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3F4F6"/>
      <stop offset="50%" stop-color="#D1D5DB"/>
      <stop offset="100%" stop-color="#9CA3AF"/>
    </linearGradient>

    <linearGradient id="binBodyGradShred" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B5563"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>

    <linearGradient id="binWindowGradShred" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#6B7280" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="paperGradShred" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F4F6"/>
    </linearGradient>

    <linearGradient id="handleGradShred" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9CA3AF"/>
      <stop offset="50%" stop-color="#F9FAFB"/>
      <stop offset="100%" stop-color="#9CA3AF"/>
    </linearGradient>

    <filter id="dropShadowShred" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="ledGlowShred" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g filter="url(#dropShadowShred)">
    <!-- 1. SHREDDER BASE & WHEELS / FEET -->
    <rect x="136" y="440" width="32" height="18" rx="6" fill="#111827"/>
    <rect x="344" y="440" width="32" height="18" rx="6" fill="#111827"/>
    <rect x="120" y="450" width="272" height="10" rx="5" fill="#030712"/>

    <!-- 2. WASTE CONTAINER BIN (LOWER BODY) -->
    <rect x="116" y="210" width="280" height="234" rx="20" fill="url(#binBodyGradShred)"/>
    <rect x="124" y="218" width="264" height="218" rx="16" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Translucent View Window -->
    <rect x="176" y="270" width="160" height="145" rx="14" fill="url(#binWindowGradShred)" stroke="#9CA3AF" stroke-width="2" stroke-opacity="0.5"/>

    <!-- DENSE SHREDDED PAPER STRIPS FALLING & FILLING BIN -->
    <!-- Falling Strips coming out from beneath the Motor Head (y=215 -> y=380) -->
    <g fill="#FFFFFF" opacity="0.9">
      <!-- Strip 1 -->
      <path d="M 180 215 L 186 215 L 184 370 L 178 370 Z"/>
      <!-- Strip 2 -->
      <path d="M 195 215 L 201 215 L 200 395 L 194 395 Z"/>
      <!-- Strip 3 -->
      <path d="M 210 215 L 216 215 L 218 360 L 212 360 Z"/>
      <!-- Strip 4 -->
      <path d="M 225 215 L 231 215 L 229 405 L 223 405 Z"/>
      <!-- Strip 5 -->
      <path d="M 240 215 L 246 215 L 247 380 L 241 380 Z"/>
      <!-- Strip 6 -->
      <path d="M 255 215 L 261 215 L 259 410 L 253 410 Z"/>
      <!-- Strip 7 -->
      <path d="M 270 215 L 276 215 L 278 375 L 272 375 Z"/>
      <!-- Strip 8 -->
      <path d="M 285 215 L 291 215 L 289 400 L 283 400 Z"/>
      <!-- Strip 9 -->
      <path d="M 300 215 L 306 215 L 308 365 L 302 365 Z"/>
      <!-- Strip 10 -->
      <path d="M 315 215 L 321 215 L 319 390 L 313 390 Z"/>
      <!-- Strip 11 -->
      <path d="M 328 215 L 334 215 L 332 370 L 326 370 Z"/>
    </g>

    <!-- Slightly darker overlapping strip layer for depth -->
    <g fill="#E5E7EB" opacity="0.85">
      <path d="M 188 215 L 193 215 L 191 380 L 186 380 Z"/>
      <path d="M 203 215 L 208 215 L 207 365 L 202 365 Z"/>
      <path d="M 218 215 L 223 215 L 225 400 L 220 400 Z"/>
      <path d="M 233 215 L 238 215 L 236 385 L 231 385 Z"/>
      <path d="M 248 215 L 253 215 L 254 405 L 249 405 Z"/>
      <path d="M 263 215 L 268 215 L 266 390 L 261 390 Z"/>
      <path d="M 278 215 L 283 215 L 285 365 L 280 365 Z"/>
      <path d="M 293 215 L 298 215 L 296 408 L 291 408 Z"/>
      <path d="M 308 215 L 313 215 L 314 380 L 309 380 Z"/>
      <path d="M 323 215 L 328 215 L 326 395 L 321 395 Z"/>
    </g>

    <!-- Bin Pull Handle -->
    <rect x="206" y="234" width="100" height="14" rx="7" fill="url(#handleGradShred)"/>

    <!-- 3. PAPER SHEET (HALF-WAY IN THROAT SLOT, DISSOLVING INTO STRIPS AT BOTTOM) -->
    <!-- Top Half of Paper Sheet entering the motor head -->
    <path d="M 176 100 L 336 100 C 342 100 346 104 346 110 L 346 160 L 166 160 L 166 110 C 166 104 170 100 176 100 Z" fill="url(#paperGradShred)"/>
    <!-- Folded Corner Detail -->
    <path d="M 326 100 L 346 120 L 326 120 Z" fill="#D1D5DB"/>
    <!-- Remaining Text Lines on Top Paper Sheet -->
    <line x1="196" y1="120" x2="316" y2="120" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
    <line x1="196" y1="137" x2="296" y2="137" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>

    <!-- Shredding Serrated Cut Edge at Bottom of Paper Entry -->
    <path d="M 166 160 L 176 155 L 186 160 L 196 155 L 206 160 L 216 155 L 226 160 L 236 155 L 246 160 L 256 155 L 266 160 L 276 155 L 286 160 L 296 155 L 306 160 L 316 155 L 326 160 L 336 155 L 346 160 Z" fill="#374151"/>

    <!-- 4. SHREDDER HEAD / TOP MOTOR HOUSING -->
    <rect x="100" y="145" width="312" height="75" rx="16" fill="url(#headBodyGradShred)"/>
    <rect x="100" y="145" width="312" height="75" rx="16" fill="none" stroke="#4B5563" stroke-width="2"/>

    <!-- Top Metallic Feed Plate Rim -->
    <rect x="140" y="152" width="232" height="24" rx="8" fill="url(#silverPlateGradShred)"/>

    <!-- Feed Slot Throat (Dark Inset) -->
    <rect x="156" y="158" width="200" height="12" rx="6" fill="#030712"/>

    <!-- 5. CONTROL PANEL & ACTIVE PROCESSING INDICATORS -->
    <!-- Power Button -->
    <circle cx="126" cy="182" r="10" fill="#1F2937" stroke="#6B7280" stroke-width="1.5"/>
    <path d="M 126 177 L 126 182" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
    <path d="M 122.5 179.5 A 5 5 0 1 0 129.5 179.5" fill="none" stroke="#10B981" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Pulsing Active Green LED -->
    <circle cx="366" cy="182" r="7" fill="#10B981" filter="url(#ledGlowShred)"/>
    <circle cx="366" cy="182" r="3.5" fill="#FFFFFF"/>

    <!-- Motion/Processing Indicator LED -->
    <circle cx="386" cy="182" r="5" fill="#3B82F6" filter="url(#ledGlowShred)"/>

    <!-- Accent Line -->
    <rect x="176" y="195" width="160" height="4" rx="2" fill="#4B5563"/>
  </g>
</svg>
