  <ellipse cx="168" cy="138" rx="15" ry="9" fill="#F472B6" fill-opacity="0.6" />

  <!-- Curious Looking-Up Eyes -->
  <!-- Left Eye -->
  <ellipse cx="84" cy="116" rx="10" ry="13" fill="#4C1D95" />
  <circle cx="87" cy="110" r="4.5" fill="white" />
  <circle cx="81" cy="120" r="2" fill="white" />

  <!-- Right Eye -->
  <ellipse cx="160" cy="116" rx="10" ry="13" fill="#4C1D95" />
  <circle cx="163" cy="110" r="4.5" fill="white" />
  <circle cx="157" cy="120" r="2" fill="white" />

