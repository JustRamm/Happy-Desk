<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mochiBg" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF0EB" />
      <stop offset="100%" stop-color="#FFE4DD" />
    </linearGradient>
    <linearGradient id="mochiBody" x1="40" y1="40" x2="200" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#FFF3EF" />
      <stop offset="100%" stop-color="#FFDBD0" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="120" y1="8" x2="120" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="mochiShadow" x="15" y="175" width="210" height="55" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <!-- Soft Ambient Drop Shadow -->
  <ellipse cx="120" cy="202" rx="76" ry="15" fill="#AB3500" fill-opacity="0.16" filter="url(#mochiShadow)" />

  <!-- Main Mochi Squishy Body -->
  <path d="M34 148C24 93 56 48 120 48C184 48 216 93 206 148C198 188 166 204 120 204C74 204 42 188 34 148Z" fill="url(#mochiBody)" stroke="#AB3500" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left Arm Resting Comfortably -->
  <path d="M48 152C38 158 35 172 45 174Z" fill="url(#mochiBody)" stroke="#AB3500" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Arm Nub Lifted under Chin in Thinking Pose -->
  <path d="M152 142C164 128 178 134 168 152Z" fill="url(#mochiBody)" stroke="#AB3500" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Rosy Pastel Cheeks -->
  <ellipse cx="72" cy="138" rx="15" ry="9" fill="#F472B6" fill-opacity="0.6" />
  <ellipse cx="168" cy="138" rx="15" ry="9" fill="#F472B6" fill-opacity="0.6" />

  <!-- Pensive Tilted Eyebrows (Thinking Expression) -->
  <path d="M74 98Q84 92 94 98" stroke="#AB3500" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M146 98Q156 92 166 98" stroke="#AB3500" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Curious Looking-Up / Pensive Eyes -->
  <!-- Left Eye -->
  <ellipse cx="84" cy="114" rx="10" ry="12" fill="#4C1D95" />
  <circle cx="87" cy="108" r="4.5" fill="white" />
  <circle cx="81" cy="118" r="2" fill="white" />

  <!-- Right Eye -->
  <ellipse cx="160" cy="114" rx="10" ry="12" fill="#4C1D95" />
  <circle cx="163" cy="108" r="4.5" fill="white" />
  <circle cx="157" cy="118" r="2" fill="white" />

  <!-- Cute Sideways Pensive 'o' Mouth -->
  <ellipse cx="122" cy="136" rx="4.5" ry="5.5" fill="#4C1D95" />

  <!-- Serene Sprout Leaf -->
  <path d="M120 48C120 26 102 10 82 17C82 36 100 48 120 48Z" fill="url(#leafGrad)" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M120 48C120 26 138 10 158 17C158 36 140 48 120 48Z" fill="#6EE7B7" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M120 48V32" stroke="#047857" stroke-width="3" stroke-linecap="round"/>

  <!-- Floating Thought Bubbles (Classic Thinking Signal) -->
  <circle cx="174" cy="74" r="4" fill="white" stroke="#AB3500" stroke-width="2" />
  <circle cx="186" cy="60" r="7" fill="white" stroke="#AB3500" stroke-width="2" />
  <ellipse cx="204" cy="38" rx="20" ry="15" fill="white" stroke="#AB3500" stroke-width="2.5" />
  
  <!-- Glowing Idea Lightbulb inside Thought Cloud -->
  <path d="M204 28C209 28 212 32 211 37C209 40 206 43 206 45H202C202 43 199 40 197 37C196 32 199 28 204 28Z" fill="#FBBF24" stroke="#D97706" stroke-width="1.8"/>
  <rect x="202" y="46" width="4" height="2.5" rx="1" fill="#9CA3AF"/>
  <path d="M204 23V25M194 28L197 30M214 28L211 30" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Left Sparkle -->
  <path d="M38 42L39 48L45 49L39 50L38 56L37 50L31 49L37 48L38 42Z" fill="#3B82F6" opacity="0.8"/>
</svg>
