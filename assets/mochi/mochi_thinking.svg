  <path d="M150 148C162 136 178 140 170 156Z" fill="url(#mochiBody)" stroke="#AB3500" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Rosy Pastel Cheeks -->
