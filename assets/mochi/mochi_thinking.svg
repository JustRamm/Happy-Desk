  <path d="M198 32C204 32 208 37 206 43C204 47 200 50 200 53H196C196 50 192 47 190 43C188 37 192 32 198 32Z" fill="#FBBF24" stroke="#D97706" stroke-width="2"/>
  <rect x="196" y="54" width="4" height="3" rx="1" fill="#9CA3AF"/>
