  <path d="M34 148C24 93 56 48 120 48C184 48 216 93 206 148C198 188 166 204 120 204C74 204 42 188 34 148Z" fill="url(#mochiBody)" stroke="#AB3500" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Rosy Pastel Cheeks -->
  <ellipse cx="72" cy="138" rx="15" ry="9" fill="#F472B6" fill-opacity="0.7" />
  <ellipse cx="168" cy="138" rx="15" ry="9" fill="#F472B6" fill-opacity="0.7" />

  <!-- Happy Wide Open Eyes with Big Sparkles -->
  <ellipse cx="82" cy="116" rx="11" ry="14" fill="#4C1D95" />
  <circle cx="79" cy="110" r="5" fill="white" />
  <circle cx="86" cy="122" r="2.5" fill="white" />

