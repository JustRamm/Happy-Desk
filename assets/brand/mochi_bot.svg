<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mochiBg" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF0EB" />
      <stop offset="100%" stop-color="#FFE4DD" />
    </linearGradient>
    <linearGradient id="mochiBody" x1="50" y1="60" x2="190" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#FFF3EF" />
      <stop offset="100%" stop-color="#FFDBD0" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="120" y1="20" x2="120" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="mochiShadow" x="30" y="160" width="180" height="50" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="10" />
    </filter>
  </defs>

  <!-- Outer Rounded Container Base -->
  <rect width="240" height="240" rx="120" fill="url(#mochiBg)"/>

  <!-- Soft Ambient Drop Shadow -->
  <ellipse cx="120" cy="185" rx="60" ry="14" fill="#AB3500" fill-opacity="0.14" filter="url(#mochiShadow)" />

  <!-- Main Mochi Squishy Body -->
  <path d="M52 140C44 95 70 58 120 58C170 58 196 95 188 140C182 172 156 186 120 186C84 186 58 172 52 140Z" fill="url(#mochiBody)" stroke="#AB3500" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Rosy Pastel Cheeks -->
  <ellipse cx="80" cy="132" rx="12" ry="7" fill="#F472B6" fill-opacity="0.6" />
  <ellipse cx="160" cy="132" rx="12" ry="7" fill="#F472B6" fill-opacity="0.6" />

  <!-- Sparkly Loving Eyes -->
  <!-- Left Eye -->
  <ellipse cx="88" cy="116" rx="9" ry="11" fill="#4C1D95" />
  <circle cx="85" cy="112" r="3.5" fill="white" />
  <circle cx="91" cy="120" r="1.8" fill="white" />

  <!-- Right Eye -->
  <ellipse cx="152" cy="116" rx="9" ry="11" fill="#4C1D95" />
  <circle cx="149" cy="112" r="3.5" fill="white" />
  <circle cx="155" cy="120" r="1.8" fill="white" />

  <!-- Adorable Sweet Smile -->
  <path d="M112 130C116 136 124 136 128 130" stroke="#4C1D95" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Serene Sprout Leaf -->
  <path d="M120 58C120 40 106 26 90 32C90 48 104 58 120 58Z" fill="url(#leafGrad)" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M120 58C120 40 134 26 150 32C150 48 136 58 120 58Z" fill="#6EE7B7" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M120 58V45" stroke="#047857" stroke-width="3" stroke-linecap="round"/>

  <!-- Floating Magic Sparkles -->
  <path d="M185 45L187 52L194 54L187 56L185 63L183 56L176 54L183 52L185 45Z" fill="#F472B6"/>
  <path d="M50 55L51 60L56 61L51 62L50 67L49 62L44 61L49 60L50 55Z" fill="#F59E0B"/>
